# The basics, on every push and every pull request: formatting, go.mod, vet,
# a build for every platform the releases are made for, and the tests with
# coverage.
#
# The linter is in golang-ci-lint.yml; the shell fuzzer and the recordings
# made against a server are in recorder-ci.yml (run by hand: they take long and
# need secrets).
#
# The coverage badge in the README is made here, with no service and no secret:
# on a push to main the Linux run writes the total as a shields.io endpoint file
# (coverage.json) and the per-function report (coverage.md), and the last job
# commits both to the branch "badges" with the workflow's own GITHUB_TOKEN. The
# branch is created the first time. Nothing to set up.
name: ci

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch makes the run for the older one pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (formatting, go.mod, vet, builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # the platforms .goreleaser.yaml builds for, so a change that only breaks
      # FreeBSD or NetBSD shows up here and not at release time
      - name: Build for every release platform
        env:
          CGO_ENABLED: "0"
        run: |
          for goos in linux darwin freebsd netbsd; do
            for goarch in amd64 arm64; do
              echo "== $goos/$goarch"
              GOOS=$goos GOARCH=$goarch go build ./... || exit 1
            done
          done

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build the recorder and the editor
        run: |
          go build -o trecs ./recorder
          go build -o trecs-edit ./editor
          ./trecs help | head -5

      # macOS ships bash 3.2, which cannot mark its prompts (that needs 4.4):
      # the scripted-session tests use a newer one
      - name: A bash the prompt marks work in (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Test
        run: go test ./... -skip "TestNewVTScreenSizedClampsInput" -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: |
          {
            echo "### coverage / ${{ runner.os }}"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The badge and the report come from the Linux run, and only for main: a branch or a pull request must not move the badge.
      - name: Make the coverage badge and report
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir badge
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          color=$(awk -v t="$total" 'BEGIN { print (t >= 80 ? "brightgreen" : t >= 70 ? "green" : t >= 60 ? "yellowgreen" : t >= 50 ? "yellow" : t >= 40 ? "orange" : "red") }')
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$total" "$color" > badge/coverage.json
          {
            echo "# Test coverage: ${total}%"
            echo
            echo "Statement coverage of \`go test ./...\` on Linux, commit [${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}), made by the \`ci\` workflow."
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } > badge/coverage.md
          cat badge/coverage.json

      - name: Keep the badge files for the publishing job
        if: hashFiles('badge/coverage.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badge
          retention-days: 1

  # Commits the badge files to the branch "badges" (made on the first run). Only
  # this job can write to the repository; it runs no code from the repository.
  publish-coverage:
    name: publish the coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badge

      - name: Commit to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch badges "$remote" out 2>/dev/null; then
            git init --quiet -b badges out
            git -C out remote add origin "$remote"
          fi
          cp badge/coverage.json badge/coverage.md out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json coverage.md
          if git diff --cached --quiet; then
            echo "the coverage did not change"
            exit 0
          fi
          git commit --quiet -m "Coverage for ${GITHUB_SHA::7}"
          git push --quiet origin badges
