# Builds the recorder and the editor on Linux and macOS, runs the transparency
# fuzzer and the fault-injection suite (recorder/fuzz) on each, then makes a real
# recording on each:
# logs in to a trecs server, has the recorder type a file of commands
# into a shell
# (-commands-file: no terminal needed) and uploads the result (-upload).
# Every shell is tried
# on every OS, so this is also where zsh (the macOS default) and fish get
# exercised.
#
# One-time setup, in the repository's
# Settings > Secrets and variables > Actions:
#   secret    TRECS_PASSWORD   the account's password
#   variable  TRECS_EMAIL      the account's email
#   variable  TRECS_SERVER
#
---
name: recorder

"on":
  workflow_dispatch:
    inputs:
      commands_file:
        description: "File of commands to record, relative to the Go module"
        default: lib/testdata/ci-session.txt
      human_like:
        description: "Type with human pauses (slower; also exercises that path)"
        type: boolean
        default: true
      visibility:
        description: "Visibility of the uploaded recordings"
        type: choice
        options: [unlisted, private, public]
        default: unlisted
      fuzz_seeds:
        description: "Seeds for the transparency fuzzer, N-M (each seed is a session in every shell, about 40 s each)"
        default: "1-12"
      fuzz_shells:
        description: "Shells for the transparency fuzzer"
        default: "bash,zsh,fish"
      fuzz_strict:
        description: "Fail on any difference the fuzzer finds, including the cosmetic ones (default: only the serious ones)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TRECS_SERVER: ${{ secrets.TRECS_SERVER }}

defaults:
  run:
    working-directory: .

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: Trecs-GH-Actions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # macos-latest is Apple Silicon;
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build the recorder and the editor
        run: |
          go build -o trecs ./recorder
          go build -o trecs-edit ./editor
          ./trecs help | head -5
      # macOS ships bash 3.2, which cannot mark its prompts (that needs 4.4):
      # the scripted-session tests use a newer one
      - name: A bash the prompt marks work in (macOS)
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Test
        run: go test ./... -skip "TestNewVTScreenSizedClampsInput" -v

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: |
            trecs
            trecs-edit
          if-no-files-found: error

  # Does the recorder only record? recorder/fuzz runs the same random sessions
  # in a shell on a pseudo-terminal with and without the recorder and compares
  # them, then injects faults (signals, a full disk, a dead stdout...). No server
  # or secrets are needed, so this job has no `environment:`.
  # macOS: the system bash is 3.2 and cannot mark its prompts, so the harness is
  # given a newer one (TRECS_FUZZ_BASH); zsh is the system's, fish comes from brew.
  fuzz:
    name: fuzz (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TRECS_BIN: ${{ github.workspace }}/trecs
      FUZZ_SEEDS: ${{ inputs.fuzz_seeds || '1-12' }}
      FUZZ_SHELLS: ${{ inputs.fuzz_shells || 'bash,zsh,fish' }}
      FUZZ_STRICT: ${{ inputs.fuzz_strict && '--strict' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: .

      - name: Make the binaries executable (artifacts do not keep the mode)
        run: chmod +x trecs trecs-edit

      - name: Install the shells
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update && sudo apt-get install -y zsh fish vim less
              ;;
            macOS)
              brew install bash fish
              echo "TRECS_FUZZ_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Which shells these are
        shell: bash
        working-directory: recorder/fuzz
        run: |
          python3 --version
          python3 -c 'import ptyrun; [print(k, v) for k, v in ptyrun.SHELLS.items()]'
          for s in $(python3 -c 'import ptyrun; print(" ".join(ptyrun.SHELLS.values()))'); do
            echo "$s: $("$s" --version | head -1)"
          done

      - name: Fuzz the recorder against the bare shell
        shell: bash
        working-directory: recorder/fuzz
        run: |
          python3 recfuzz.py --seeds "$FUZZ_SEEDS" --shells "$FUZZ_SHELLS" --jobs 2 $FUZZ_STRICT \
            --work "$RUNNER_TEMP/fuzz-work" --json "$RUNNER_TEMP/fuzz.json" 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      # runs even if the fuzzer found something: the two are separate questions
      - name: Inject faults
        if: always()
        shell: bash
        working-directory: recorder/fuzz
        run: python3 recfaults.py 2>&1 | tee "$RUNNER_TEMP/faults.log"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### fuzz / $RUNNER_OS (seeds $FUZZ_SEEDS, shells $FUZZ_SHELLS)"
            echo '```'
            sed -n '/^==== /,$p' "$RUNNER_TEMP/fuzz.log" 2>/dev/null | head -80
            echo '```'
            echo "### faults / $RUNNER_OS"
            echo '```'
            sed -n '/^==== summary/,$p' "$RUNNER_TEMP/faults.log" 2>/dev/null | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # the raw bytes of every session that differed, for the failing seeds
      - name: Keep the logs and the failing sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ runner.os }}
          path: |
            ${{ runner.temp }}/fuzz.log
            ${{ runner.temp }}/fuzz.json
            ${{ runner.temp }}/faults.log
            ${{ runner.temp }}/fuzz-work/fail
          if-no-files-found: warn

  record:
    name: record (${{ matrix.os }}, ${{ matrix.shell }})
    needs: build
    runs-on: ${{ matrix.os }}
    environment: Trecs-GH-Actions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # auto: no -cmd, so the recorder works out the shell it was started from
        shell: [fish]
    env:
      SHELL_UNDER_TEST: ${{ matrix.shell }}
      # secret or variable, whichever you made; here, after `environment:`
      # has been applied
      TRECS_SERVER: ${{ secrets.TRECS_SERVER || vars.TRECS_SERVER }}
      TRECS_EMAIL: ${{ secrets.TRECS_EMAIL || vars.TRECS_EMAIL }}
    steps:
      - name: Check the configuration reached this job
        shell: bash
        working-directory: .
        env:
          TRECS_PASSWORD: ${{ secrets.TRECS_PASSWORD }}
          TRECS_EMAIL: ${{ secrets.TRECS_EMAIL }}
          TRECS_SERVER: ${{ secrets.TRECS_SERVER }}
        run: |
          missing=()
          [ -n "$TRECS_PASSWORD" ] || missing+=(TRECS_PASSWORD)
          [ -n "$TRECS_EMAIL" ] || missing+=(TRECS_EMAIL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Empty: ${missing[*]}. They must be in the environment named on this job (Settings > Environments), or at repository level."
            exit 1
          fi
          echo "server: $TRECS_SERVER"

      - uses: actions/checkout@v4

      - name: Names for this run
        shell: bash
        run: |
          # keeps the login out of ~/.config on the runner
          echo "TRECS_SESSION_FILE=$RUNNER_TEMP/trecs-session" >> "$GITHUB_ENV"
          echo "RECORDING_NAME=ci-$RUNNER_OS-$SHELL_UNDER_TEST-${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: .

      - name: Make the binaries executable (artifacts do not keep the mode)
        run: chmod +x trecs trecs-edit

      - name: Install the shell
        shell: bash
        run: |
          case "$RUNNER_OS/$SHELL_UNDER_TEST" in
            Linux/zsh)  sudo apt-get update && sudo apt-get install -y zsh ;;
            Linux/fish) sudo apt-get update && sudo apt-get install -y fish ;;
            macOS/fish) brew install fish htop coreutils;;
          esac

      - name: Which shells these are
        shell: bash
        run: |
          echo "runner shell: $(command -v bash) - $(bash --version | head -1)"
          for s in zsh fish; do
            if command -v "$s" >/dev/null; then echo "$s: $(command -v "$s") - $("$s" --version | head -1)"; fi
          done

      - name: Log in
        shell: bash
        env:
          TRECS_SERVER: ${{ secrets.TRECS_SERVER }}
          TRECS_PASSWORD: ${{ secrets.TRECS_PASSWORD }}
          TRECS_EMAIL: ${{ secrets.TRECS_EMAIL }}
        run: |
          printf '%s\n' "$TRECS_PASSWORD" | ./trecs login -server "$TRECS_SERVER" -email "$TRECS_EMAIL" -password-stdin

      - name: Record and upload
        shell: bash
        env:
          COMMANDS_FILE: ${{ inputs.commands_file }}
          HUMAN_LIKE: ${{ inputs.human_like && '-human-like' || '' }}
          VISIBILITY: ${{ inputs.visibility || 'unlisted' }}
        run: |
          args=(record -output "$RUNNER_TEMP/recordings" -name "$RECORDING_NAME"
                -commands-file "${COMMANDS_FILE:-lib/testdata/ci-session.txt}"
                -upload -visibility "$VISIBILITY")
          [ -n "$HUMAN_LIKE" ] && args+=("$HUMAN_LIKE")
          [ "$SHELL_UNDER_TEST" != auto ] && args+=(-cmd "$SHELL_UNDER_TEST")
          ./trecs "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/record.log"
          { echo "### $RUNNER_OS / $SHELL_UNDER_TEST"; grep -E '^(Uploaded|Watch):' "$RUNNER_TEMP/record.log"; } >> "$GITHUB_STEP_SUMMARY"

      # Reads the recording back with the editor's parser and puts the Markdown
      # it makes in the
      # job summary: if the commands or outputs are wrong for a shell, it shows
      # up here.
      - name: Export Markdown with the editor
        shell: bash
        run: |
          f=$(find "$RUNNER_TEMP/recordings" -name terminal.jsonl | head -1)
          echo "recording: $f"
          ./trecs-edit export "$f" -title "$RECORDING_NAME"
          { echo; echo '<details><summary>Markdown export</summary>'; echo; echo '````markdown'; cat "$f.md"; echo '````'; echo; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ runner.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/recordings
          if-no-files-found: warn

      - name: Log out
        if: always()
        shell: bash
        run: ./trecs logout || true
