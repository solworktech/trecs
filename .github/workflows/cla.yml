---
name: "CLA Assistant"

# Checks that the author of every pull request has signed the CLA (see CLA.md),
# and records
# signatures when a contributor replies with the sign phrase.
# Make the "CLA Assistant" check
# required in a branch ruleset on main, so an unsigned pull request cannot be
# merged.
"on":
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit, in case the repository's default workflow permissions are read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >-
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # Pin to the commit this tag points to once you have checked it
        # (the action is no longer maintained upstream).
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/solworktech/trecs/blob/main/CLA.md'
          # Must exist and must NOT be protected: the bot commits the
          # signatures here.
          branch: 'cla-signatures'
          allowlist: jessp01,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can merge it, please read our
            [Contributor Licence Agreement](https://github.com/solworktech/trecs/blob/main/CLA.md)
            (you keep your copyright) and sign it once, for this and all your future contributions,
            by replying to this comment with the sentence below.
